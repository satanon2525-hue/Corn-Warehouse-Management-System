                        <div>

                <span class="truncate">แจ้งเตือน</span>
            </button>
            <button onclick="switchView('reports')" id="bnav-reports" class="flex flex-col items-center justify-center min-w-[4.2rem] py-1 text-[10px]">
                <i data-lucide="file-text" class="w-5 h-5 mb-0.5"></i>
                <span class="truncate">รายงาน</span>
            </button>
            <button onclick="switchView('settings')" id="bnav-settings" class="flex flex-col items-center justify-center min-w-[4.2rem] py-1 text-[10px]">
                <i data-lucide="settings" class="w-5 h-5 mb-0.5"></i>
                <span class="truncate">ตั้งค่า</span>

    </main>

    <!-- MODAL FOR QR CODE & LOT DETAIL -->
    <div id="modal-qr" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-slate-800 text-lg">รายละเอียด Lot & QR Code</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex flex-col items-center justify-center py-2">
                <div id="qrcode-container" class="p-3 bg-white border border-slate-200 rounded-lg shadow-inner"></div>
                <p class="font-mono font-bold text-lg text-slate-800 mt-2" id="modal-lot-number">CORN-XXXX</p>
            </div>
            <div class="text-xs space-y-2 bg-slate-50 p-4 rounded-lg border border-slate-200" id="modal-lot-info">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="window.print()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white text-xs py-2 rounded-lg font-medium">พิมพ์ QR Code / รายละเอียด</button>
                <button onclick="closeModal()" class="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs py-2 rounded-lg font-medium">ปิด</button>
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC ARCHITECTURE -->
    <script>
        const STORAGE_KEY = 'SMART_CORN_WMS_DB';

        let appState = {
            currentUserRole: 'เจ้าของลาน',
            settings: { moistNormal: 15.0, moistWarn: 17.0, ageWarn: 14, ageMax: 30 },
            lots: [],
            weighingRecords: [],
            moistureRecords: [],
            issueRecords: [],
            activityLogs: []
        };

        // SIDEBAR TOGGLE LOGIC FOR MOBILE & DESKTOP
        function toggleSidebar() {
            const sidebar = document.getElementById('main-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const icon = document.getElementById('sidebar-toggle-icon');

            if (window.innerWidth < 768) {
                // Mobile overlay behavior
                sidebar.classList.toggle('mobile-open');
                if (backdrop) backdrop.classList.toggle('hidden');
            } else {
                // Desktop collapse behavior
                sidebar.classList.toggle('sidebar-collapsed');
                if(sidebar.classList.contains('sidebar-collapsed')) {
                    if(icon) icon.setAttribute('data-lucide', 'panel-left-open');
                } else {
                    if(icon) icon.setAttribute('data-lucide', 'panel-left-close');
                }
            }
            lucide.createIcons();
        }

        // Initialize App & Storage
        function initApp() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    appState = JSON.parse(savedData);
                } catch(e) {
                    console.error("Failed to parse stored data", e);
                }
            }
            updateDocNo();
            renderDashboard();
            lucide.createIcons();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            renderDashboard();
        }

        function changeRole(role) {
            appState.currentUserRole = role;
            document.getElementById('user-display-name').innerText = \`\${role}\`;
            document.getElementById('user-avatar').innerText = role.substring(0, 2);
            logActivity(\`เปลี่ยนสิทธิ์ผู้ใช้งานเป็น: \${role}\`);
            
            if (role === 'พนักงานชั่งน้ำหนัก') switchView('weighing');
            else if (role === 'ผู้ตรวจสอบคุณภาพ') switchView('moisture');
            else switchView('dashboard');
        }

        function switchView(viewId) {
            const views = ['dashboard', 'receiving', 'weighing', 'lots', 'map', 'moisture', 'issue', 'alerts', 'reports', 'settings'];
            views.forEach(v => {
                const el = document.getElementById(\`view-\${v}\`);
                const nav = document.getElementById(\`nav-\${v}\`);
                const bnav = document.getElementById(\`bnav-\${v}\`);
                if (el) el.classList.add('hidden');
                if (nav) nav.classList.remove('sidebar-active');
                if (bnav) bnav.classList.remove('bottom-nav-active');
            });

            const activeView = document.getElementById(\`view-\${viewId}\`);
            const activeNav = document.getElementById(\`nav-\${viewId}\`);
            const activeBnav = document.getElementById(\`bnav-\${viewId}\`);
            if (activeView) activeView.classList.remove('hidden');
            if (activeNav) activeNav.classList.add('sidebar-active');
            if (activeBnav) activeBnav.classList.add('bottom-nav-active');

            // Close mobile sidebar drawer if open
            const sidebar = document.getElementById('main-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar.classList.contains('mobile-open')) {
                sidebar.classList.remove('mobile-open');
                if (backdrop) backdrop.classList.add('hidden');
            }

            if (viewId === 'dashboard') renderDashboard();
            if (viewId === 'weighing') renderWeighingTable();
            if (viewId === 'lots') renderLotsTable();
            if (viewId === 'map') renderWarehouseMap();
            if (viewId === 'moisture') renderMoistureView();
            if (viewId === 'issue') renderIssueView();
            if (viewId === 'alerts') renderAlertsCenter();
            if (viewId === 'reports') renderReports();
            
            lucide.createIcons();
        }

        function calculateDaysStored(dateString) {
            const received = new Date(dateString);
            const today = new Date();
            const diffTime = Math.abs(today - received);
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        function evaluateLotRisk(lot) {
            let score = 0;
            const days = calculateDaysStored(lot.receivedDate);
            const moist = lot.currentMoisture;

            if (moist > appState.settings.moistWarn) score += 50;
            else if (moist > appState.settings.moistNormal) score += 25;

            if (days > appState.settings.ageMax) score += 40;
            else if (days > appState.settings.ageWarn) score += 20;

            score = Math.min(score, 100);

            let status = 'ปกติ';
            let badgeClass = 'bg-emerald-100 text-emerald-800';
            if (score > 60) { status = 'มีความเสี่ยงสูง'; badgeClass = 'bg-red-100 text-red-800'; }
            else if (score > 30) { status = 'เฝ้าระวัง'; badgeClass = 'bg-amber-100 text-amber-800'; }

            return { score, status, badgeClass, days };
        }

        function updateDocNo() {
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            const count = appState.lots.length + 1;
            const docNo = \`CORN-\${today}-\${String(count).padStart(3, '0')}\`;
            document.getElementById('rec-doc-no').value = docNo;
            document.getElementById('rec-datetime').value = new Date().toISOString().slice(0, 16);
        }

        function calcNetWeight() {
            const wIn = parseFloat(document.getElementById('rec-weight-in').value) || 0;
            const wOut = parseFloat(document.getElementById('rec-weight-out').value) || 0;
            const net = Math.max(0, Math.abs(wIn - wOut));
            document.getElementById('rec-weight-net').value = net;
            calculatePrice();
        }

        function calculatePrice() {
            const netWeight = parseFloat(document.getElementById('rec-weight-net').value) || 0;
            const bucketPrice = parseFloat(document.getElementById('price-per-bucket').value) || 0;

            if (bucketPrice > 0) {
                const pricePerKg = bucketPrice / 15;
                const totalPrice = netWeight * pricePerKg;

                document.getElementById('price-per-kg').value = pricePerKg.toFixed(2);
                document.getElementById('total-price-display').value = totalPrice.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ฿';
            } else {
                document.getElementById('price-per-kg').value = '0.00';
                document.getElementById('total-price-display').value = '0.00 ฿';
            }
        }

        function resetFormCalculations() {
            document.getElementById('price-per-kg').value = '0.00';
            document.getElementById('total-price-display').value = '0.00 ฿';
        }

        function handleReceivingSubmit(e) {
            e.preventDefault();
            const netWeight = parseFloat(document.getElementById('rec-weight-net').value);
            if (netWeight <= 0) {
                alert('คำเตือน: น้ำหนักสุทธิต้องมากกว่า 0 กิโลกรัม');
                return;
            }

            const lotNo = document.getElementById('rec-doc-no').value;
            const transactionType = document.getElementById('rec-type').value;
            const bucketPrice = parseFloat(document.getElementById('price-per-bucket').value) || 0;
            const pricePerKg = bucketPrice > 0 ? bucketPrice / 15 : 0;
            const totalPrice = netWeight * pricePerKg;

            const newLot = {
                lotNumber: lotNo,
                transactionType: transactionType,
                receivedDate: document.getElementById('rec-datetime').value,
                plate: document.getElementById('rec-plate').value,
                customerType: document.getElementById('rec-customer-type').value,
                supplier: document.getElementById('rec-supplier').value || document.getElementById('rec-customer-type').value,
                product: document.getElementById('rec-product').value,
                currentMoisture: parseFloat(document.getElementById('rec-moisture').value),
                weightIn: parseFloat(document.getElementById('rec-weight-in').value),
                weightOut: parseFloat(document.getElementById('rec-weight-out').value),
                netWeight: netWeight,
                currentWeight: transactionType === 'รับเข้า' ? netWeight : 0,
                bucketPrice: bucketPrice,
                pricePerKg: pricePerKg,
                totalPrice: totalPrice,
                location: document.getElementById('rec-location').value,
                remark: document.getElementById('rec-remark').value,
                grade: 'A'
            };

            appState.lots.unshift(newLot);
            appState.weighingRecords.unshift({
                datetime: newLot.receivedDate,
                plate: newLot.plate,
                supplier: newLot.supplier,
                weightIn: newLot.weightIn,
                weightOut: newLot.weightOut,
                netWeight: newLot.netWeight,
                lotNumber: newLot.lotNumber
            });

            logActivity(\`บันทึกรายการ [\${transactionType}] Lot: \${newLot.lotNumber} ปริมาณ \${newLot.netWeight} กก. มูลค่า \${totalPrice.toLocaleString()} บาท\`);
            saveData();
            alert(\`บันทึกสำเร็จ! ทำรายการ [\${transactionType}] หมายเลข Lot: \${newLot.lotNumber}\\nราคารวมทั้งสิ้น: \${totalPrice.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท\`);
            
            document.getElementById('form-receiving').reset();
            resetFormCalculations();
            updateDocNo();
            switchView('lots');
        }

        let chartInOutInstance = null;
        let chartQualityInstance = null;

        function renderDashboard() {
            const emptyNotice = document.getElementById('empty-state-notice');
            if (appState.lots.length === 0) {
                emptyNotice.classList.remove('hidden');
            } else {
                emptyNotice.classList.add('hidden');
            }

            let totalStock = 0;
            let totalMoist = 0;
            let warningCount = 0;
            let riskCount = 0;

            appState.lots.forEach(lot => {
                totalStock += lot.currentWeight;
                totalMoist += lot.currentMoisture;
                const risk = evaluateLotRisk(lot);
                if (risk.score > 60) riskCount++;
                else if (risk.score > 30) warningCount++;
            });

            const avgMoist = appState.lots.length > 0 ? (totalMoist / appState.lots.length).toFixed(1) : 0;
            const estValue = (totalStock * 11.5).toLocaleString();

            document.getElementById('dash-total-stock').innerHTML = \`\${(totalStock / 1000).toFixed(2)} <span class="text-sm font-normal text-slate-500">ตัน</span>\`;
            document.getElementById('dash-today-in').innerHTML = \`\${(totalStock / 1000).toFixed(2)} <span class="text-sm font-normal text-slate-500">ตัน</span>\`;
            document.getElementById('dash-avg-moisture').innerHTML = \`\${avgMoist} <span class="text-sm font-normal text-slate-500">%</span>\`;
            document.getElementById('dash-count-lots').innerText = appState.lots.length;
            document.getElementById('dash-count-vehicles').innerText = appState.weighingRecords.length;
            document.getElementById('dash-warning-lots').innerText = warningCount;
            document.getElementById('dash-risk-lots').innerText = riskCount;
            document.getElementById('dash-est-value').innerText = \`\${estValue} ฿\`;
            document.getElementById('dash-used-capacity').innerText = \`\${Math.min(100, (totalStock / 500000 * 100)).toFixed(0)}%\`;

            renderCharts();
        }

        function renderCharts() {
            const ctx1 = document.getElementById('chart-inout').getContext('2d');
            if (chartInOutInstance) chartInOutInstance.destroy();

            chartInOutInstance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [
                        { label: 'รับเข้า (ตัน)', data: [12, 19, 15, 22, 28, 14, (appState.lots.filter(l=>l.transactionType==='รับเข้า').reduce((a,b)=>a+b.netWeight,0)/1000)], backgroundColor: '#10b981' },
                        { label: 'จ่ายออก (ตัน)', data: [5, 8, 12, 10, 15, 9, (appState.lots.filter(l=>l.transactionType==='จ่ายออก').reduce((a,b)=>a+b.netWeight,0)/1000)], backgroundColor: '#3b82f6' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctx2 = document.getElementById('chart-quality').getContext('2d');
            if (chartQualityInstance) chartQualityInstance.destroy();

            let cornSeed = appState.lots.filter(l => l.product === 'ข้าวโพดเมล็ด').length;
            let cornCob = appState.lots.filter(l => l.product === 'ข้าวโพดฝัก').length;

            chartQualityInstance = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['ข้าวโพดเมล็ด', 'ข้าวโพดฝัก'],
                    datasets: [{
                        data: [cornSeed || 1, cornCob || 0],
                        backgroundColor: ['#f59e0b', '#10b981']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderWarehouseMap() {
            const container = document.getElementById('map-grid-container');
            const locations = ['A01', 'A02', 'B01', 'B02', 'C01', 'D01'];
            
            let html = '';
            locations.forEach(loc => {
                const lotsInLoc = appState.lots.filter(l => l.location === loc && l.currentWeight > 0);
                let totalLocWeight = lotsInLoc.reduce((acc, l) => acc + l.currentWeight, 0);
                
                let maxRiskScore = 0;
                lotsInLoc.forEach(l => {
                    const r = evaluateLotRisk(l);
                    if (r.score > maxRiskScore) maxRiskScore = r.score;
                });

                let statusColor = 'border-slate-300 bg-white';
                let badge = '<span class="px-2 py-0.5 rounded text-xs bg-slate-200 text-slate-600">ว่าง</span>';
                
                if (lotsInLoc.length > 0) {
                    if (maxRiskScore > 60) {
                        statusColor = 'border-red-500 bg-red-50/50';
                        badge = '<span class="px-2 py-0.5 rounded text-xs bg-red-500 text-white font-bold">เสี่ยงสูง</span>';
                    } else if (maxRiskScore > 30) {
                        statusColor = 'border-amber-500 bg-amber-50/50';
                        badge = '<span class="px-2 py-0.5 rounded text-xs bg-amber-500 text-white font-bold">เฝ้าระวัง</span>';
                    } else {
                        statusColor = 'border-emerald-500 bg-emerald-50/50';
                        badge = '<span class="px-2 py-0.5 rounded text-xs bg-emerald-500 text-white font-bold">ปกติ</span>';
                    }
                }

                html += \`
                    <div class="border-2 \${statusColor} rounded-xl p-5 shadow-sm space-y-3">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h3 class="font-bold text-lg text-slate-800">กองจัดเก็บ \${loc}</h3>
                            \${badge}
                        </div>
                        <div class="space-y-1 text-sm">
                            <p class="text-slate-600">ปริมาณคงเหลือ: <strong class="text-slate-800">\${(totalLocWeight/1000).toFixed(2)} ตัน</strong></p>
                            <p class="text-slate-600">จำนวน Lot: <strong class="text-slate-800">\${lotsInLoc.length} Lot</strong></p>
                        </div>
                        <div class="pt-2 border-t text-xs text-slate-500">
                            \${lotsInLoc.map(l => \`• \${l.lotNumber} (\${l.product} - \${l.currentMoisture}%)\`).join('<br>') || 'ไม่มีสินค้า'}
                        </div>
                    </div>
                \`;
            });
            container.innerHTML = html;
        }

        function renderLotsTable() {
            const tbody = document.getElementById('table-lots-body');
            if (appState.lots.length === 0) {
                tbody.innerHTML = \`<tr><td colspan="9" class="p-4 text-center text-slate-400">ยังไม่มีข้อมูล Lot ข้าวโพด</td></tr>\`;
                return;
            }

            tbody.innerHTML = appState.lots.map(lot => {
                const risk = evaluateLotRisk(lot);
                const isTypeIn = lot.transactionType === 'รับเข้า';
                return \`
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-mono font-bold text-amber-700">\${lot.lotNumber}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded text-xs font-bold \${isTypeIn ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">\${lot.transactionType || 'รับเข้า'}</span></td>
                        <td class="p-3 font-medium text-slate-800">\${lot.product || 'ข้าวโพดเมล็ด'}</td>
                        <td class="p-3 font-medium text-slate-800">\${lot.supplier} <span class="text-xs text-slate-400">(\${lot.customerType || 'ลูกค้าทั่วไป'})</span></td>
                        <td class="p-3"><span class="px-2 py-0.5 bg-slate-100 rounded border text-xs font-bold">\${lot.location}</span></td>
                        <td class="p-3 text-right font-bold">\${lot.currentWeight.toLocaleString()}</td>
                        <td class="p-3 text-center font-semibold text-cyan-700">\${lot.currentMoisture}%</td>
                        <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-xs \${risk.badgeClass} font-bold">\${risk.score} (\${risk.status})</span></td>
                        <td class="p-3 text-center">
                            <button onclick="openQRModal('\${lot.lotNumber}')" class="px-2 py-1 bg-slate-800 text-white rounded text-xs hover:bg-slate-700">QR / Detail</button>
                        </td>
                    </tr>
                \`;
            }).join('');
        }

        function openQRModal(lotNo) {
            const lot = appState.lots.find(l => l.lotNumber === lotNo);
            if (!lot) return;

            document.getElementById('modal-lot-number').innerText = lot.lotNumber;

            document.getElementById('modal-lot-info').innerHTML = \`
                <div class="grid grid-cols-2 gap-1">
                    <div><strong>ประเภทรายการ:</strong> \${lot.transactionType || 'รับเข้า'}</div>
                    <div><strong>สินค้า:</strong> \${lot.product || 'ข้าวโพดเมล็ด'}</div>
                    <div><strong>ลูกค้า/ผู้ขาย:</strong> \${lot.supplier}</div>
                    <div><strong>ประเภทลูกค้า:</strong> \${lot.customerType || 'ลูกค้าทั่วไป'}</div>
                    <div><strong>ทะเบียนรถ:</strong> \${lot.plate}</div>
                    <div><strong>ตำแหน่งจัดเก็บ:</strong> \${lot.location}</div>
                    <div><strong>น้ำหนักสุทธิ:</strong> \${lot.netWeight.toLocaleString()} กก.</div>
                    <div><strong>ความชื้น:</strong> \${lot.currentMoisture}%</div>
                    <div><strong>ราคา/ถัง:</strong> \${lot.bucketPrice || 0} บาท</div>
                    <div><strong>จำนวนเงินรวม:</strong> \${(lot.totalPrice || 0).toLocaleString()} บาท</div>
                </div>
            \`;

            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: JSON.stringify({ lot: lot.lotNumber, supplier: lot.supplier, product: lot.product, weight: lot.netWeight }),
                width: 128,
                height: 128
            });

            document.getElementById('modal-qr').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-qr').classList.add('hidden');
        }

        function renderMoistureView() {
            const select = document.getElementById('moist-lot-id');
            select.innerHTML = appState.lots.map(l => \`<option value="\${l.lotNumber}">\${l.lotNumber} (\${l.location} - ชื้นเดิม \${l.currentMoisture}%)</option>\`).join('');

            const tbody = document.getElementById('table-moisture-history');
            if (appState.moistureRecords.length === 0) {
                tbody.innerHTML = \`<tr><td colspan="5" class="p-4 text-center text-slate-400">ยังไม่มีประวัติการตรวจวัด</td></tr>\`;
                return;
            }

            tbody.innerHTML = appState.moistureRecords.map(m => \`
                <tr class="hover:bg-slate-50">
                    <td class="p-2.5 text-xs">\${m.datetime}</td>
                    <td class="p-2.5 font-mono font-bold text-amber-700">\${m.lotNumber}</td>
                    <td class="p-2.5 text-center font-bold text-cyan-700">\${m.val}%</td>
                    <td class="p-2.5 text-center"><span class="px-2 py-0.5 rounded text-xs \${m.val > appState.settings.moistWarn ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800'} font-bold">\${m.val > appState.settings.moistWarn ? 'ความชื้นสูง' : 'ปกติ'}</span></td>
                    <td class="p-2.5 text-xs">\${m.inspector}</td>
                </tr>
            \`).join('');
        }

        function handleMoistureSubmit(e) {
            e.preventDefault();
            const lotNo = document.getElementById('moist-lot-id').value;
            const moistVal = parseFloat(document.getElementById('moist-val').value);
            const inspector = document.getElementById('moist-inspector').value || 'พนักงาน';

            const lot = appState.lots.find(l => l.lotNumber === lotNo);
            if (lot) {
                lot.currentMoisture = moistVal;
            }

            appState.moistureRecords.unshift({
                datetime: new Date().toLocaleString('th-TH'),
                lotNumber: lotNo,
                val: moistVal,
                inspector: inspector
            });

            logActivity(\`อัปเดตค่าความชื้น Lot: \${lotNo} เป็น \${moistVal}%\`);
            saveData();
            alert('อัปเดตความชื้นสำเร็จ!');
            renderMoistureView();
        }

        function renderIssueView() {
            const select = document.getElementById('issue-lot-id');
            const availableLots = appState.lots.filter(l => l.currentWeight > 0);
            select.innerHTML = availableLots.map(l => \`<option value="\${l.lotNumber}">\${l.lotNumber} [คงเหลือ: \${l.currentWeight.toLocaleString()} กก. | ชื้น: \${l.currentMoisture}%]</option>\`).join('');

            const recoContainer = document.getElementById('recommendation-cards');
            if (availableLots.length === 0) {
                recoContainer.innerHTML = \`<p class="text-sm text-slate-500">ไม่มีสินค้าคงเหลือสำหรับเบิกจ่าย</p>\`;
                return;
            }

            const fifoLot = [...availableLots].sort((a,b) => new Date(a.receivedDate) - new Date(b.receivedDate))[0];
            const fefoLot = [...availableLots].sort((a,b) => evaluateLotRisk(b).score - evaluateLotRisk(a).score)[0];

            recoContainer.innerHTML = \`
                <div class="bg-white p-3 rounded-lg border border-indigo-100 shadow-sm">
                    <span class="px-2 py-0.5 bg-blue-100 text-blue-800 text-xs font-bold rounded">จ่ายตาม FIFO (เก่าสุด)</span>
                    <h4 class="font-bold text-slate-800 mt-1">\${fifoLot.lotNumber}</h4>
                    <p class="text-xs text-slate-500">จัดเก็บเมื่อ: \${fifoLot.receivedDate.split('T')[0]} (\${calculateDaysStored(fifoLot.receivedDate)} วันมาแล้ว)</p>
                </div>
                <div class="bg-white p-3 rounded-lg border border-indigo-100 shadow-sm">
                    <span class="px-2 py-0.5 bg-amber-100 text-amber-800 text-xs font-bold rounded">จ่ายตาม FEFO (เสี่ยงสูงสุด)</span>
                    <h4 class="font-bold text-slate-800 mt-1">\${fefoLot.lotNumber}</h4>
                    <p class="text-xs text-slate-500">ความชื้น: \${fefoLot.currentMoisture}% | Risk Score: \${evaluateLotRisk(fefoLot).score}</p>
                </div>
            \`;
        }

        function handleIssueSubmit(e) {
            e.preventDefault();
            const lotNo = document.getElementById('issue-lot-id').value;
            const issueWeight = parseFloat(document.getElementById('issue-weight').value);
            const lot = appState.lots.find(l => l.lotNumber === lotNo);

            if (!lot || issueWeight > lot.currentWeight) {
                alert('ข้อผิดพลาด: ปริมาณการเบิกจ่ายเกินกว่าน้ำหนักที่มีอยู่ใน Lot!');
                return;
            }

            lot.currentWeight -= issueWeight;
            appState.issueRecords.unshift({
                datetime: new Date().toLocaleString('th-TH'),
                lotNumber: lotNo,
                customer: document.getElementById('issue-customer').value,
                weight: issueWeight,
                operator: document.getElementById('issue-operator').value
            });

            logActivity(\`เบิกจ่ายสินค้าจาก Lot: \${lotNo} ปริมาณ \${issueWeight} กก.\`);
            saveData();
            alert('บันทึกการเบิกจ่ายสำเร็จ!');
            renderIssueView();
        }

                <tr class="hover:bg-slate-50">

            \`).join('');

        function renderAlertsCenter() {
            const container = document.getElementById('alerts-container');
            let alerts = [];

            appState.lots.forEach(lot => {
                const risk = evaluateLotRisk(lot);
                if (lot.currentMoisture > appState.settings.moistWarn) {
                    alerts.push({ title: \`ความชื้นสูงเกินเกณฑ์มาตรฐาน\`, desc: \`Lot: \${lot.lotNumber} มีความชื้น \${lot.currentMoisture}% (กอง \${lot.location})\`, type: 'red' });
                }
                if (risk.days > appState.settings.ageMax) {
                    alerts.push({ title: \`จัดเก็บนานเกินกำหนด\`, desc: \`Lot: \${lot.lotNumber} จัดเก็บมาแล้ว \${risk.days} วัน\`, type: 'amber' });
                }
            });

            document.getElementById('alert-badge').innerText = alerts.length;
            if (alerts.length > 0) document.getElementById('alert-badge').classList.remove('hidden');

            if (alerts.length === 0) {
                container.innerHTML = \`<p class="text-slate-400 text-center py-6">ไม่มีรายการแจ้งเตือนเตือนภัยในขณะนี้</p>\`;
                return;
            }

            container.innerHTML = alerts.map(a => \`
                <div class="p-4 rounded-lg border-l-4 \${a.type === 'red' ? 'border-red-500 bg-red-50' : 'border-amber-500 bg-amber-50'} flex items-start gap-3">
                    <i data-lucide="alert-triangle" class="w-5 h-5 \${a.type === 'red' ? 'text-red-600' : 'text-amber-600'} shrink-0 mt-0.5"></i>
                    <div>
                        <h4 class="font-bold text-sm \${a.type === 'red' ? 'text-red-900' : 'text-amber-900'}">\${a.title}</h4>
                        <p class="text-xs \${a.type === 'red' ? 'text-red-700' : 'text-amber-700'}">\${a.desc}</p>
                    </div>
                </div>
            \`).join('');
            lucide.createIcons();
        }

        function renderReports() {
            document.getElementById('report-date').innerText = new Date().toLocaleDateString('th-TH');
            const tbody = document.getElementById('report-table-body');
            tbody.innerHTML = appState.lots.map(l => {
                const r = evaluateLotRisk(l);
                return \`
                    <tr>
                        <td class="border p-2 font-mono">\${l.lotNumber}</td>

                        <td class="border p-2 text-right">\${l.currentWeight.toLocaleString()}</td>
                        <td class="border p-2 text-center">\${l.currentMoisture}%</td>
                        <td class="border p-2 text-center">\${r.score}</td>
                    </tr>
                \`;
            }).join('');
        }

        function saveSettings() {

        // Device Switcher Logic
        function switchDevice(type) {
            const wrapper = document.getElementById('frame-wrapper');
            const btnDesktop = document.getElementById('btn-desktop');
            const btnMobile = document.getElementById('btn-mobile');
            const infoText = document.getElementById('device-info-text');

            if (type === 'mobile') {
                wrapper.className = 'preview-frame mobile-shell bg-white overflow-hidden relative';
                
                btnMobile.className = 'flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold transition bg-amber-500 text-slate-950 shadow';
                btnDesktop.className = 'flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition';
                
                infoText.innerText = 'โหมดปัจจุบัน: มือถือ Mobile Mockup (390px x 844px)';
            } else {
                wrapper.className = 'preview-frame desktop-shell bg-white overflow-hidden relative';
                
                btnDesktop.className = 'flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold transition bg-amber-500 text-slate-950 shadow';
                btnMobile.className = 'flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition';
                
                infoText.innerText = 'โหมดปัจจุบัน: Desktop (100% Full Width)';
            }
        }
