<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคีย์ข้อมูล รับ-จ่าย ลานท่าข้าวโพด</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px; background-color: #eef2f3; color: #333;
        }
        header {
            background-color: #2c3e50; color: white; padding: 15px 20px; 
            border-radius: 8px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-size: 1.5rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .main-layout {
            display: grid; grid-template-columns: 1fr 2fr; gap: 20px;
            align-items: start;
        }
        
        .card {
            background-color: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card-header-flex {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px;
        }
        .card-title { margin: 0; color: #2980b9; }

        .btn-refresh {
            background-color: #3498db; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
        }
        .btn-refresh:hover { background-color: #2980b9; }

        /* ฟอร์มกรอกข้อมูล */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        .form-control {
            width: 100%; padding: 10px; border: 1px solid #ccc; 
            border-radius: 6px; box-sizing: border-box; font-size: 1rem;
        }
        .form-control:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52,152,219,0.3); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* กล่องคำนวณเงิน */
        .calc-box { background-color: #f8f9f9; padding: 15px; border-radius: 6px; border: 1px dashed #bdc3c7; margin-bottom: 15px; }
        .result-amount { font-size: 2rem; color: #27ae60; font-weight: bold; text-align: center; margin: 10px 0; }
        
        .btn-submit {
            background-color: #27ae60; color: white; width: 100%; padding: 12px;
            font-size: 1.1rem; font-weight: bold; border: none; border-radius: 6px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-submit:hover { background-color: #219150; }
        .btn-submit:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        /* ตารางประวัติ */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #ecf0f1; }
        .badge-in { background-color: #d5f5e3; color: #27ae60; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-out { background-color: #fadbd8; color: #c0392b; padding: 4px 8px; border-radius: 4px; font-weight: bold; }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚜 ระบบบันทึกข้อมูลหน้าลานท่าข้าวโพด</h1>
            <div style="font-size: 0.9rem; background: #34495e; padding: 5px 10px; border-radius: 4px;">
                วันที่ระบบ: <span id="current-date"></span>
            </div>
        </header>

        <div class="main-layout">
            
            <!-- ส่วนที่ 1: ฟอร์มกรอกข้อมูล (ด้านซ้าย) -->
            <section class="card">
                <div class="card-header-flex">
                    <h2 class="card-title">📝 บันทึกรายการใหม่</h2>
                </div>
                <form id="entry-form">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>ประเภทรายการ</label>
                            <select id="type" class="form-control" required>
                                <option value="รับเข้า">รับเข้า (ซื้อจากชาวบ้าน)</option>
                                <option value="จ่ายออก">จ่ายออก (ขายส่งโรงงาน)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>ทะเบียนรถ</label>
                            <input type="text" id="plate" class="form-control" placeholder="เช่น กข 1234" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>ประเภทลูกค้า</label>
                            <input type="text" id="customerType" class="form-control" placeholder="เช่น ขาประจำ, ขาจร" required>
                        </div>
                        <div class="form-group">
                            <label>สินค้า</label>
                            <select id="product" class="form-control" required>
                                <option value="ข้าวโพดเมล็ด">ข้าวโพดเมล็ด</option>
                                <option value="ข้าวโพดฝัก">ข้าวโพดฝัก</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ความชื้น (%) <span style="color:red; font-size: 0.8rem; font-weight: normal;">*ชื้นน้อย=ราคาสูง ชื้นมาก=ราคาต่ำ</span></label>
                        <input type="number" id="moisture" class="form-control" step="0.1" placeholder="เช่น 14.5" required>
                    </div>

                    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

                    <!-- ส่วนคำนวณน้ำหนัก -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>น้ำหนักรถเข้า (กก.)</label>
                            <input type="number" id="weightIn" class="form-control input-calc" placeholder="0" required>
                        </div>
                        <div class="form-group">
                            <label>น้ำหนักรถออก (กก.)</label>
                            <input type="number" id="weightOut" class="form-control input-calc" placeholder="0" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>น้ำหนักสุทธิ (กก.) <span style="color:#7f8c8d; font-size:0.8rem;">(ระบบคำนวณให้อัตโนมัติ)</span></label>
                        <input type="number" id="netWeight" class="form-control" style="background:#e8f8f5; font-weight:bold;" readonly>
                    </div>

                    <!-- ส่วนช่วยคำนวณราคา -->
                    <div class="calc-box">
                        <div class="form-row" style="margin-bottom: 10px;">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label style="color:#d35400;">เครื่องช่วยคิด: ราคาต่อถัง (บาท)</label>
                                <input type="number" id="pricePerBucket" class="form-control input-calc" placeholder="เช่น 95 (1 ถัง=15กก.)">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label style="color:#2980b9;">ราคาต่อกิโลกรัม (บาท)</label>
                                <input type="number" id="pricePerKg" class="form-control input-calc" step="0.01" placeholder="ใส่เอง หรือใช้เครื่องช่วยคิด" required>
                            </div>
                        </div>
                        
                        <div style="text-align: center; margin-top: 15px;">
                            <span style="color: #7f8c8d; font-size: 0.9rem;">จำนวนเงินรวมที่ต้องชำระ (บาท)</span>
                            <div class="result-amount" id="display-total">฿ 0.00</div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">💾 บันทึกข้อมูลขึ้นระบบ</button>
                </form>
            </section>

            <!-- ส่วนที่ 2: ตารางแสดงประวัติประจำวัน (ด้านขวา) -->
            <section class="card">
                <div class="card-header-flex">
                    <h2 class="card-title">📋 ประวัติการรับรถทั้งหมด</h2>
                    <button id="btn-refresh" class="btn-refresh" onclick="fetchDataFromGoogleSheets()">🔄 ดึงข้อมูลล่าสุด</button>
                </div>
                <div style="overflow-x: auto;">
                    <table id="logTable">
                        <thead>
                            <tr>
                                <th>เวลา</th>
                                <th>รถ/ลูกค้า</th>
                                <th>ความชื้น</th>
                                <th>นน.สุทธิ(กก.)</th>
                                <th>ราคา/กก.</th>
                                <th>ยอดเงิน(บาท)</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="6" style="color:#777;">⏳ กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>

   <script>
        // ----------------------------------------------------
        // 1. วาง Web App URL ที่ได้จาก Google Apps Script ที่นี่ที่เดียว!
        // ----------------------------------------------------
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzdCtXWCfpQVH_x3xwEwdKJuLBtHhTb0dDwQ_evdbX-7o7L0-dYHRhwwlEjKdi_4Y6O/exec';

        // แสดงวันที่ปัจจุบัน
        const dateOptions = { year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('th-TH', dateOptions);

        const weightInEl = document.getElementById('weightIn');
        const weightOutEl = document.getElementById('weightOut');
        const netWeightEl = document.getElementById('netWeight');
        
        const pricePerBucketEl = document.getElementById('pricePerBucket');
        const pricePerKgEl = document.getElementById('pricePerKg');
        const displayTotalEl = document.getElementById('display-total');
        let totalAmount = 0;

        function calculateAll() {
            let wIn = parseFloat(weightInEl.value) || 0;
            let wOut = parseFloat(weightOutEl.value) || 0;
            let net = Math.abs(wIn - wOut);
            netWeightEl.value = wIn > 0 && wOut > 0 ? net : 0;

            if (document.activeElement === pricePerBucketEl && pricePerBucketEl.value !== "") {
                let bucketPrice = parseFloat(pricePerBucketEl.value);
                pricePerKgEl.value = (bucketPrice / 15).toFixed(2);
            } else if (document.activeElement === pricePerBucketEl && pricePerBucketEl.value === "") {
                pricePerKgEl.value = "";
            }

            let priceKg = parseFloat(pricePerKgEl.value) || 0;
            totalAmount = (net * priceKg);
            displayTotalEl.innerText = '฿ ' + totalAmount.toLocaleString('th-TH', {minimumFractionDigits: 2});
        }

        document.querySelectorAll('.input-calc').forEach(input => {
            input.addEventListener('input', calculateAll);
        });

        // ----------------------------------------------------
        // ฟังก์ชันดึงข้อมูลจาก Google Sheets แสดงบนหน้าเว็บ
        // ----------------------------------------------------
        async function fetchDataFromGoogleSheets() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="6" style="color:#777;">⏳ กำลังโหลดข้อมูลล่าสุด...</td></tr>';

            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === '' || GOOGLE_SCRIPT_URL.includes('วาง_')) {
                tbody.innerHTML = '<tr><td colspan="6" style="color:red;">ยังไม่ได้ใส่ GOOGLE_SCRIPT_URL ในโค้ด</td></tr>';
                return;
            }

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                
                if(!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="color:#999;">ยังไม่มีข้อมูลในระบบ</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                // วนลูปแสดงข้อมูลเอาอันใหม่ไว้บนสุด
                data.reverse().forEach(t => {
                    const badge = t.type === 'รับเข้า' ? 'badge-in' : 'badge-out';
                    const moneyColor = t.type === 'รับเข้า' ? '#c0392b' : '#27ae60';

                    const row = `
                        <tr>
                            <td>${t.time} <br><span class="${badge}" style="font-size:0.75rem;">${t.type}</span></td>
                            <td>${t.plate}<br><span style="font-size:0.8rem; color:#777;">${t.customerType}</span></td>
                            <td>${t.moisture}%</td>
                            <td style="font-weight:bold;">${parseFloat(t.netWeight || 0).toLocaleString('th-TH')}</td>
                            <td>${parseFloat(t.pricePerKg || 0).toFixed(2)}</td>
                            <td style="color:${moneyColor}; font-weight:bold; text-align:right;">
                                ${parseFloat(t.totalAmount || 0).toLocaleString('th-TH', {minimumFractionDigits: 2})}
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
            } catch (error) {
                console.error("Error loading data:", error);
                tbody.innerHTML = '<tr><td colspan="6" style="color:red;">เกิดข้อผิดพลาดในการดึงข้อมูล กรุณากดปุ่มรีเฟรชอีกครั้ง</td></tr>';
            }
        }

        // เมื่อกดปุ่ม บันทึกข้อมูล
        document.getElementById('entry-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (parseFloat(netWeightEl.value) <= 0) {
                alert("กรุณาตรวจสอบน้ำหนักเข้า-ออกให้ถูกต้อง (น้ำหนักสุทธิต้องมากกว่า 0)");
                return;
            }

            const submitBtn = this.querySelector('.btn-submit');
            submitBtn.disabled = true;
            submitBtn.innerText = '⏳ กำลังบันทึกข้อมูล...';

            const newRecord = {
                type: document.getElementById('type').value,
                plate: document.getElementById('plate').value,
                customerType: document.getElementById('customerType').value,
                product: document.getElementById('product').value,
                moisture: document.getElementById('moisture').value,
                netWeight: netWeightEl.value,
                pricePerKg: pricePerKgEl.value,
                totalAmount: totalAmount
            };

            try {
                if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes('วาง_')) {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newRecord)
                    });
                }

                alert(`บันทึกข้อมูลรถทะเบียน ${newRecord.plate} สำเร็จ!`);
                this.reset();
                displayTotalEl.innerText = '฿ 0.00';
                
                // โหลดข้อมูลในตารางใหม่ทันทีหลังบันทึกเสร็จ
                setTimeout(fetchDataFromGoogleSheets, 1500);

            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '💾 บันทึกข้อมูลขึ้นระบบ';
            }
        });

        // โหลดข้อมูลตารางอัตโนมัติเมื่อเปิดหน้าเว็บ
        fetchDataFromGoogleSheets();

        // ตั้งระบบให้รีเฟรชตารางอัตโนมัติทุกๆ 30 วินาที
        setInterval(fetchDataFromGoogleSheets, 30000);
    </script>
</body>
</html>
